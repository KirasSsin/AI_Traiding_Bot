[project]
name = "ai-trading-bot"
version = "0.1.0-alpha.1"
description = "Binance Spot BTC/USDT 1H trading bot (MVP v0.1)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "pyarrow>=15.0",
  "python-binance>=1.0.19",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.98",
  "ruff>=0.3",
  "mypy>=1.9",
  "pre-commit>=3.6",
  "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["binance.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
