[project]
name = "ai-trading-bot"
version = "0.1.0-alpha.1"
description = "Binance Spot BTC/USDT 1H trading bot (MVP v0.1)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "pyarrow>=15.0",
  "pybit>=5.11",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "TA-Lib>=0.4.28",
  "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.98",
  "ruff>=0.3",
  "mypy>=1.9",
  "pre-commit>=3.6",
  "types-pyyaml",
]
# S25 ADR 0039: dashboard optional deps. Install via `pip install -e ".[dashboard]"`.
# Architectural isolation: WFA pipeline (_cmd_wfa) does NOT depend on these.
dashboard = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
  "tests/claude-code",
  "tests/brainstorm-server",
  "tests/explicit-skill-requests",
  "tests/opencode",
  "tests/skill-triggering",
  "tests/subagent-driven-dev",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Legacy code — оставляется untouched до соответствующих спринтов (S3-S5).
"src/core/*" = ["ALL"]
"src/backtest/*" = ["ALL"]
"src/risk/risk_manager.py" = ["ALL"]
# RuntimeManager unit tests use MagicMock side_effect lambdas с **kw / signal placeholders
# (intentional — match real callable signatures для mock substitution). E402 — datetime
# import after _settings helper (intentional helper-grouping pattern).
"tests/unit/test_runtime_manager.py" = ["ARG005", "E402"]
# Test sections group their imports mid-file by Sprint 7 task (Task 9/10) —
# intentional helper-grouping pattern matching the file's existing structure.
"tests/unit/test_halt_persistence.py" = ["E402"]
# Test names follow spec (V5, BybitFilters, NOT_reentrant) — uppercase intentional.
"tests/unit/test_filters.py" = ["N802"]
"tests/unit/test_bybit_rest.py" = ["N802"]
"tests/unit/test_reconciler_threading.py" = ["N802"]
# FilterViolation name is part of the public API contract from the task spec.
"src/marketdata/filters.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pybit.*", "pyarrow.*", "talib", "pandas", "pandas.*", "plotly", "plotly.*", "scipy", "scipy.*"]
ignore_missing_imports = true

# S9 Q2 (G): legacy ignore_errors override removed (was: src.core.*, src.backtest.*,
# src.risk.*). Empirical pre-removal check: all 3 modules pass `mypy --strict` clean.
# Override masked zero actual errors. Removal converts implicit pass → explicit
# type checking, prevents future drift.

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property"]
asyncio_mode = "auto"
markers = [
  "integration: requires live Bybit testnet (env-gated)",
]
